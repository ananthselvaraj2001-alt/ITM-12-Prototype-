<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .hero p {
      margin-top: 1rem;
      font-size: 1.125rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div>
      <h1>Your headline goes here</h1>
      <p>Simple placeholder text in the center of the screen.</p>
    </div>
  </section>
</body>
</html>
